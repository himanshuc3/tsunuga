# Alternative of makefile
# Orchestration for different stuff that we run
# since everything isn't controlled by the language
version: "3"

dotenv:
  - .env

# vars:
#   TANGO_DB_DSN: '{{.TANGO_DB_DSN | default ""}}'

tasks:
  help:
    desc: print this help message
    cmds:
      - task --list-all
    silent: true

  confirm:
    desc: confirmation prompt
    cmds:
      - |
        echo -n 'Are you sure? [y/N] ' && read ans && [ "${ans:-N}" = y ]
    silent: true
    internal: true

  infra:
    desc: Start Infrastructure (external deps) required for local dev
    cmds:
      - docker compose up -d --wait --wait-timeout 60

  dev:
    desc: Start infrastructure and Go server with hot reload
    deps:
      - infra
    cmds:
      - air

  infra:down:
    desc: Stop dev infra
    cmds:
      - docker compose down -v

  infra:logs:
    desc: Show infra logs
    cmds:
      - docker compose logs -f

  test:
    cmds:
      - go test ./..

  run:
    desc: run the tsununga server
    cmds:
      - go run ./cmd/tango

  build:
    cmds:
      - go build -o bin/tango ./cmd/tango

  migrations:new:
    desc: create a new database migration
    vars:
      NAME: '{{.name | default ""}}'
    cmds:
      - |
        if [ -z "{{.NAME}}" ]; then
          echo "Error: name parameter is required"
          echo "Usage: task migrations:new name=migration_name"
          exit 1
        fi
      - echo 'Creating migration file for {{.NAME}}...'
      - tern new -m ./internal/database/migrations {{.NAME}}

  migrations:up:
    desc: apply all up database migrations
    deps: [confirm]
    cmds:
      - echo 'Running up migrations...'
      - tern migrate -m ./internal/database/migrations --conn-string {{.TANGO_DB_DSN}}

  migrations:up:auto:
    internal: true
    cmds:
      - tern migrate -m ./internal/database/migrations --conn-string {{.TANGO_DB_DSN}}

  tidy:
    desc: format all .go files, and tidy and vendor module deps
    cmds:
      - echo 'Formatting .go files...'
      - go fmt ./...
      - echo 'Tidying module deps...'
      - go mod tidy
      - echo 'Verifying deps...'
      - go mod verify
