id: lesson-02-people-professions
title: "People and professions"
position: 200

concepts:
  - id: c-ja-arimasen
    position: 100
    title: "Ja arimasen: the negative of desu"
    body: "Use N1 wa N2 ja arimasen to politely say that N1 is not N2. Ja arimasen is the negative form of desu."
    meta: "Example: Watashi wa gakusei ja arimasen. = I am not a student."

  - id: c-ka
    position: 200
    title: "The particle ka"
    body: "Put ka at the end of a sentence to turn it into a question."
    meta: "Example: Anata wa isha desu ka. = Are you a doctor?"

  - id: c-mo
    position: 300
    title: "The particle mo"
    body: "Use mo after a noun to mean also or too. It is similar to bhi in Hindi."
    meta: "Example: Watashi mo kaishain desu. = I am also a company employee."

