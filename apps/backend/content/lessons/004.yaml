id: lesson-04-objects
title: "Objects and nouns"
position: 400

concepts:
  - id: c-kore-sore-are
    position: 100
    title: "Kore, sore, and are"
    body: "Use kore for this thing near you, sore for that thing near the listener, and are for that thing away from both speakers. These words can stand alone."
    meta: "Example: Kore wa hon desu. = This is a book."

  - id: c-kono-sono-ano
    position: 200
    title: "Kono, sono, and ano"
    body: "Use kono, sono, and ano before a noun: kono for this, sono for that near the listener, and ano for that away from both speakers."
    meta: "Example: Kono jisho wa watashi no desu. = This dictionary is mine."

