id: lesson-03-establishments
title: "Civilization"
position: 300

concepts:
  - id: c-no
    position: 100
    title: "The particle no"
    body: "Use no between two nouns to show that the first noun belongs to, describes, or is related to the second noun. It is similar to ka or ki in Hindi."
    meta: "Example: Daigaku no sensei = a university teacher."

  - id: c-sou-desu
    position: 200
    title: "Sou desu: an affirmative reply"
    body: "Use sou desu to politely agree with or confirm a statement. It means that is correct or yes, that is so."
    meta: "Example: A: Ano kata wa isha desu ka. B: Hai, sou desu. = A: Is that person a doctor? B: Yes, that is correct."

  - id: c-ka-choices
    position: 300
    title: "The particle ka for choices"
    body: "Put ka between two choices when asking which one someone means or prefers."
    meta: "Example: Daigaku desu ka, byouin desu ka. = Is it a university or a hospital?"

